[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 forbids function calls in argument defaults, but `Depends(...)` and
# `Form(...)` in defaults is exactly how FastAPI declares dependencies — the
# rule is a false positive for this framework.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
# Puts the project root on sys.path so `import app` resolves under a bare
# `pytest`. Without it only `python -m pytest` works, which silently adds the
# working directory — a discrepancy that passes locally and fails in CI.
pythonpath = ["."]
