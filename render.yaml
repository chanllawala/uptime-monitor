# Simplest possible deployment: a single free web service, nothing else.
#
# Deliberately provisions no database. Render allows only one free Postgres
# per account, so a blueprint that asks for one fails if that slot is already
# used. With DATABASE_URL unset the app falls back to SQLite and needs no
# database resource at all.
#
# Render's free tier also has no worker process type, so the poller runs
# inside the web process via RUN_SCHEDULER_IN_WEB.
#
# Two caveats, both inherent to the free tier rather than to this config:
#   - free services sleep after ~15 minutes idle, so polling pauses until
#     someone opens the dashboard again
#   - the free filesystem is ephemeral, so the SQLite history resets when the
#     service restarts. The app re-seeds itself on boot, so it comes back with
#     monitors ready rather than empty.
#
# To keep history across restarts, set DATABASE_URL in the service's
# Environment tab to any Postgres connection string. Nothing else changes.
#
# For a deployment that polls continuously and keeps its history, see
# deploy/oracle-cloud.md.

services:
  - type: web
    name: uptime-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Seeding is idempotent, so it is safe on every boot and means the
    # dashboard has monitors to show the moment the service comes up.
    startCommand: python -m app.seed && uvicorn app.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: RUN_SCHEDULER_IN_WEB
        value: "true"
      - key: FAILURE_THRESHOLD
        value: "3"
      - key: LOG_FORMAT
        value: json
      - key: PYTHON_VERSION
        value: 3.13.7
